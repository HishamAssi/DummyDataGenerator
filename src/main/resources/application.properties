spring.application.name=DummyDataGenerator

# Postgres properties
# spring.datasource.url=${SPRING_DATASOURCE_URL}
# spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA properties
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server properties
server.port=8080
server.servlet.context-path=/api

# Logging properties
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.hisham.dummydatagenerator=DEBUG

# Kafka debug logging
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.springframework.boot.autoconfigure=INFO

# Application (DDG) properties
dummy.generator.default.rowcount=1000
dummy.generator.csv.output.dir=./output
dummy.generator.csv.include.header=true

# Make spring boot bind to localhost
server.address=0.0.0.0

# Kafka Configuration
# spring.kafka.bootstrap-servers=localhost:9092
# spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# spring.kafka.producer.properties.spring.json.add.type.headers=false
# spring.kafka.producer.properties.spring.json.use.type.headers=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,env,threaddump,loggers
management.endpoints.web.base-path=/manage
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.info.git.mode=full
management.info.env.enabled=true

# Security Configuration for Actuator
management.security.enabled=true
spring.security.user.name=admin
spring.security.user.password=${ACTUATOR_PASSWORD:secure-admin-password-2025}
spring.security.user.roles=ADMIN,ACTUATOR